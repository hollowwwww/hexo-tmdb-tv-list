name: Publish to npm
on:
  release:
    types: [published] # 当在 GitHub 上发布 Release 时触发

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 如果使用 OIDC 可信发布则需要，用 NPM_TOKEN 则不必
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --access public # 如果是普通包，可去掉 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}